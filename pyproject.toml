[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "rag-comp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "anyio>=4.0",
    "httpx>=0.27",
    "anthropic>=0.40",
    "tiktoken>=0.7",
    "rich>=13.0",
    "pandas>=2.0",
    "openai>=1.0",
]

[project.optional-dependencies]
parsers = [
    "pypdf>=4.0",
    "python-docx>=1.0",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "pillow>=10.0",
    "msoffcrypto-tool==6.0.0",
]
search = [
    "rank-bm25>=0.2",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "I"]
